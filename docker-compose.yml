version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: paimonitor
      POSTGRES_PASSWORD: paimonitor
      POSTGRES_DB: paimonitor
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://paimonitor:paimonitor@db:5432/paimonitor
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/ml/weights:/app/app/ml/weights

  ingest-worker:
    build: ./backend
    restart: unless-stopped
    command: python -m app.services.s3_ingest
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://paimonitor:paimonitor@db:5432/paimonitor
    depends_on:
      - db
      - backend
    volumes:
      - ./backend/app/ml/weights:/app/app/ml/weights

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pg_data:
